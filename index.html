<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="panel">
      <sp-checkbox id="enabled" size="s" checked>有効</sp-checkbox>

      <sp-slider id="opacity" min="1" max="100" step="1" value="100" size="s">
        <sp-label slot="label">不透明度</sp-label>
      </sp-slider>

      <sp-checkbox id="strokeBorder" size="s">ブラシで境界線を描く</sp-checkbox>
      <sp-checkbox id="selectionOnly" size="s"
        >塗りつぶさずに選択範囲だけ残す</sp-checkbox
      >

      <sp-divider size="medium"></sp-divider>

      <sp-label class="title">削除モードの判定</sp-label>
      <sp-radio-group id="modifierSource" name="modifierSource" size="s" column>
        <sp-radio value="keyboard" checked>キー状態を直接取得</sp-radio>
        <sp-radio value="event">選択の合成方法で判定</sp-radio>
        <sp-radio value="panel">パネルで切り替え</sp-radio>
      </sp-radio-group>

      <div id="keyboardOptions" class="sub">
        <sp-radio-group id="deleteKey" name="deleteKey" size="s" column>
          <sp-radio value="ctrlKey" checked>Ctrl / Cmd で削除</sp-radio>
          <sp-radio value="altKey">Alt で削除</sp-radio>
          <sp-radio value="shiftKey">Shift で削除</sp-radio>
        </sp-radio-group>
      </div>

      <div id="eventOptions" class="sub hidden">
        <sp-radio-group id="deleteTrigger" name="deleteTrigger" size="s" column>
          <sp-radio value="addTo" checked>Shift + 投げ縄で削除</sp-radio>
          <sp-radio value="subtractFrom">Alt + 投げ縄で削除</sp-radio>
        </sp-radio-group>
      </div>

      <div id="panelOptions" class="sub hidden">
        <sp-radio-group id="panelMode" name="panelMode" size="s" column>
          <sp-radio value="fill" checked>塗りつぶし</sp-radio>
          <sp-radio value="delete">削除</sp-radio>
        </sp-radio-group>
      </div>

      <div id="keystateWarning" class="warning hidden">
        <div id="keystateNotice"></div>
        <sp-action-button id="recheck" size="s" quiet>再チェック</sp-action-button>
      </div>

      <sp-divider size="medium"></sp-divider>

      <sp-checkbox id="lassoOnly" size="s" checked>投げ縄ツールのみ</sp-checkbox>
      <sp-checkbox id="oneUndo" size="s" checked>Ctrl+Z 一回で戻す</sp-checkbox>
    </div>

    <script src="main.js"></script>
  </body>
</html>
